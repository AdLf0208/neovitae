[mod]
id = "neovitae"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure altar arithmetic (standalone crate lib, injected as
# `crate::game::neovitae`): tiers, tank sizes, rune multipliers, the recipe
# table and the crafting loop.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "neovitae"
source = "runtime.rs"

# Game-side glue: the block entity, its slot, the tick, the right clicks, the
# orb and the harness commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "neovitae_state"
source = "support.rs"

# The content half is inside this bundle (`data/neovitae-content.hmod`, the built
# `content/neovitae.hmod`): this writes it to `.horizon-cache/` and appends it to
# the dev-mod list, so one `.hnmod` installs the altar and the code (the AE2
# pattern; the registry keeps one file per project).
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The altar gets a block entity (API 15).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and ticks on the server (API 15).
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# The altar's one slot (API 16/17). No menu: a right click still reaches the
# use hooks, as upstream's GUI-less `ItemStackHandler` does.
[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "container" },
]

# The altar's tick: revalidate the structure, settle a queued sacrifice, run the
# crafting loop (API 17).
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# A right click with an item on the altar puts one item in its slot
# (upstream's `useItemOn`), API 13.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# A right click with the orb in hand pays LP into a nearby altar (API 13).
[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# An empty-hand right click takes the altar's stack back (API 21).
[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# `/neovitae altar|lp` (API 8).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
